0" r="23" fill="#ac765c"/><text x="714.0" y="314.0" text-anchor="middle" class="s">张昭 ←</text><rect x="674.0" y="336.0" width="80" height="76" fill="#b7aa83" stroke="#7c765f"/><circle cx="714.0" cy="374.0" r="23" fill="#ac765c"/><text x="714.0" y="434.0" text-anchor="middle" class="s">顾雍 ←</text><rect x="674.0" y="456.0" width="80" height="76" fill="#b7aa83" stroke="#7c765f"/><circle cx="714.0" cy="494.0" r="23" fill="#ac765c"/><text x="714.0" y="554.0" text-anchor="middle" class="s">鲁肃 ←</text><rect x="674.0" y="576.0" width="80" height="76" fill="#b7aa83" stroke="#7c765f"/><circle cx="714.0" cy="614.0" r="23" fill="#ac765c"/><text x="714.0" y="674.0" text-anchor="middle" class="s">士人甲 ←</text><rect x="674.0" y="696.0" width="80" height="76" fill="#b7aa83" stroke="#7c765f"/><circle cx="714.0" cy="734.0" r="23" fill="#ac765c"/><text x="714.0" y="794.0" text-anchor="middle" class="s">士人乙 ←</text><polyline points="170,846.0 170,342.0 258.0,342.0 258.0,254.0" fill="none" stroke="#177c85" stroke-width="5" stroke-dasharray="12 7"/><text x="340" y="630" class="s">孔明沿空走道 → 席侧 → 整衣跪坐</text><text x="340" y="660" class="s">不穿案、不跨他人坐席</text><text x="65" y="985" class="s">尺寸、人数与具体座次均为调度提案，待完整场景与史料细核。</text><text x="65" y="1018" class="s">已检查二维路线避开案桌；不代表生成视频已通过物理验收。</text></svg>